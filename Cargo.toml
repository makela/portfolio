[package]
name = "portfolio"
version = "0.1.0"
edition = "2021"
description = "Personal portfolio and resume site (Axum + Maud)"
repository = "https://github.com/makela/portfolio"
# The code only; the site's texts and images are not MIT (see README).
license = "MIT"
# A website, not a library: never publish to crates.io by accident.
publish = false

[dependencies]
# Only what the site uses: HTTP/1 on tokio, plus axum's internal tracing events.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tracing"] }
maud = { version = "0.27", features = ["axum"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Development only, enabled by `just watch` (see the livereload feature).
tower-livereload = { version = "0.10.3", optional = true }
notify = { version = "=8.2.0", optional = true }

[features]
# Reload the browser when the server restarts or a file in static/ changes.
livereload = ["dep:tower-livereload", "dep:notify"]

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
# Broad groups (priority -1 so the individual lints below can override them)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics: a web server should handle errors instead of crashing
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "warn"

# Leftovers that shouldn't reach production
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Keep #[allow] usage honest
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Smaller, slightly faster release binary for ~15 s more build time; debug
# builds (`cargo run`, `just watch`) are unaffected. panic stays "unwind" so a
# panicking request can't take the whole server down.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
